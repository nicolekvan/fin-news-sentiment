[project]
name = "marketlens"
version = "0.1.0"
description = "MarketLens AI: company-level financial news sentiment (bullish / bearish / neutral)"
requires-python = ">=3.11"
dependencies = [
    "anthropic==2.11.0",
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "joblib==1.6.0",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "scikit-learn==1.9.1",
    "slowapi==0.1.10",
    "sqlalchemy==2.1.9",
    "ta==0.11.0",
    "tenacity==9.2.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
# FinBERT inference. Install CPU-only torch in CI/jobs to keep the download small.
ml = ["torch==2.15.0", "transformers==5.23.0"]
dev = ["pytest==9.2.0", "respx==0.23.1", "ruff==0.17.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["marketlens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header"]

[tool.ruff.lint.isort]
known-first-party = ["marketlens", "tests"]
