[project]
name = "finsent"
version = "0.1.0"
description = "Entity-level sentiment (bullish / bearish / neutral) for financial news"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
transformer = ["torch>=2.1", "transformers>=4.40", "datasets>=2.18"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
